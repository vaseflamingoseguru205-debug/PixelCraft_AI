<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelCraft AI - Admin Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0F172A; /* Slate 900 */
            --surface-color: #1E293B; /* Slate 800 */
            --surface-hover: #334155; /* Slate 700 */
            --primary: #3B82F6; /* Blue 500 */
            --primary-hover: #60A5FA; /* Blue 400 */
            --text-primary: #F8FAFC; /* Slate 50 */
            --text-secondary: #94A3B8; /* Slate 400 */
            --border-color: #334155;
            --accent: #10B981; /* Emerald 500 */
            --danger: #EF4444; /* Red 500 */
            --shadow-glow: 0 0 20px rgba(59, 130, 246, 0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.08), transparent 25%);
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin-top: 60px;
            padding: 0 20px;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), var(--shadow-glow);
            padding: 40px;
            backdrop-filter: blur(10px);
        }

        /* --- Login View --- */
        .login-box {
            max-width: 420px;
            margin: 0 auto;
            text-align: center;
            transform: translateY(20px);
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
            from { opacity: 0; transform: translateY(20px); }
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff, #94A3B8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 15px;
        }

        .input-group {
            margin-bottom: 24px;
            text-align: left;
            position: relative;
        }

        input[type="password"] {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background-color: #0F172A;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 16px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
            font-family: monospace;
            letter-spacing: 2px;
        }

        input[type="password"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .lock-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        button.primary-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), #2563EB);
            color: white;
            border: none;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        button.primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
            background: linear-gradient(135deg, var(--primary-hover), var(--primary));
        }

        .error {
            color: var(--danger);
            font-size: 14px;
            margin-top: 16px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 10px;
            border-radius: 8px;
            display: none;
        }

        /* --- Dashboard View --- */
        #dashboard {
            display: none;
            padding: 30px;
            animation: fadeIn 0.5s ease-out forwards;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .logout-btn {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .logout-btn:hover {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border-color: var(--danger);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
        }

        .stat-card.blue::before { background-color: var(--primary); }
        .stat-card.green::before { background-color: var(--accent); }

        .stat-label {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .table-container {
            background-color: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: rgba(30, 41, 59, 0.8);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:last-child td { border-bottom: none; }
        
        tr:hover td {
            background-color: rgba(59, 130, 246, 0.05);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--surface-hover);
            object-fit: cover;
            border: 2px solid var(--border-color);
        }

        .user-name { font-weight: 600; color: var(--text-primary); }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

    </style>
</head>
<body>

<div class="container">
    <!-- Login Screen -->
    <div class="card login-box" id="login-view">
        <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="url(#blue-grad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 16px;">
            <defs>
                <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#60A5FA" />
                    <stop offset="100%" stop-color="#2563EB" />
                </linearGradient>
            </defs>
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <h1>Admin Protocol</h1>
        <p class="subtitle">Authenticate to access the command center.</p>
        
        <div class="input-group">
            <svg class="lock-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" id="admin-password" placeholder="Enter API Key / Password" autocomplete="off" />
        </div>
        <button id="login-btn" class="primary-btn">Initialize Connection</button>
        <div class="error" id="error-msg">❌ Invalid credentials. Access denied.</div>
    </div>

    <!-- Dashboard Screen -->
    <div class="card" id="dashboard">
        <div class="dashboard-header">
            <div>
                <h1 style="margin-bottom: 4px; font-size: 24px;">Admin Console</h1>
                <div style="color: var(--text-secondary); font-size: 14px; display: flex; align-items: center; gap: 6px;">
                    <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background-color: var(--accent); box-shadow: 0 0 8px var(--accent);"></span>
                    System Live & Secure
                </div>
            </div>
            <button class="logout-btn" id="logout-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Lock Session
            </button>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card blue">
                <div class="stat-label">Total Authenticated Users</div>
                <div class="stat-value" id="total-users">0</div>
            </div>
            <div class="stat-card green">
                <div class="stat-label">Database Status</div>
                <div class="stat-value" style="color: var(--accent); font-size: 24px; margin-top: auto;">Connected</div>
            </div>
        </div>

        <div class="table-container">
            <table id="users-table">
                <thead>
                    <tr>
                        <th>User Profile</th>
                        <th>Email Address</th>
                        <th>Date Joined</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="users-tbody">
                    <!-- Data injected here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const loginView = document.getElementById('login-view');
    const dashboardView = document.getElementById('dashboard');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const passwordInput = document.getElementById('admin-password');
    const errorMsg = document.getElementById('error-msg');
    const tbody = document.getElementById('users-tbody');
    const totalUsersEl = document.getElementById('total-users');

    let sessionPassword = sessionStorage.getItem('admin_pass') || '';

    // Check if already logged in this session
    if (sessionPassword) {
        fetchUsers(sessionPassword);
    }

    loginBtn.addEventListener('click', () => {
        const pass = passwordInput.value;
        if (!pass) return;
        
        loginBtn.innerHTML = '<span style="opacity:0.7">Connecting...</span>';
        loginBtn.disabled = true;
        fetchUsers(pass);
    });

    passwordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') loginBtn.click();
    });

    logoutBtn.addEventListener('click', () => {
        sessionStorage.removeItem('admin_pass');
        sessionPassword = '';
        passwordInput.value = '';
        dashboardView.style.display = 'none';
        loginView.style.display = 'block';
    });

    async function fetchUsers(password) {
        try {
            const res = await fetch('/api/admin/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });

            if (!res.ok) {
                throw new Error('Unauthorized');
            }

            const users = await res.json();
            
            // Success
            sessionStorage.setItem('admin_pass', password);
            errorMsg.style.display = 'none';
            loginView.style.display = 'none';
            dashboardView.style.display = 'block';
            
            renderUsers(users);

        } catch (err) {
            errorMsg.style.display = 'block';
            sessionStorage.removeItem('admin_pass');
        } finally {
            loginBtn.textContent = 'Initialize Connection';
            loginBtn.disabled = false;
        }
    }

    function renderUsers(users) {
        totalUsersEl.textContent = users.length;
        tbody.innerHTML = '';
        
        users.forEach(user => {
            const tr = document.createElement('tr');
            
            const joined = new Date(user.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            
            const defaultAvatar = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23334155'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E`;
            
            tr.innerHTML = `
                <td>
                    <div class="user-info">
                        <img src="${user.avatar || defaultAvatar}" class="avatar" alt="avatar" onerror="this.src='${defaultAvatar}'">
                        <span class="user-name">${user.name}</span>
                    </div>
                </td>
                <td style="color: var(--text-secondary); font-family: monospace; font-size: 14px;">${user.email}</td>
                <td style="color: var(--text-secondary);">${joined}</td>
                <td><span class="badge">Verified</span></td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login to PixelCraft AI</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      background-image: radial-gradient(circle at center, rgba(37, 99, 235, 0.1) 0%, transparent 70%);
    }

    .login-container {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 50px 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-size: 3.5rem;
      margin-bottom: 20px;
      display: inline-block;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #fff;
    }

    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 35px;
      line-height: 1.5;
    }

    .google-btn-wrapper {
      position: relative;
      padding: 3px;
      border-radius: 12px;
      background: linear-gradient(60deg, #4285F4, #EA4335, #FBBC05, #34A853, #4285F4);
      background-size: 300% 300%;
      animation: borderGradient 4s ease infinite;
      display: block;
      transition: transform 0.3s;
    }

    .google-btn-wrapper:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(66, 133, 244, 0.3);
    }

    @keyframes borderGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #fff;
      color: #1e293b;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
      width: 100%;
      box-sizing: border-box;
      transition: background 0.3s;
    }

    .google-btn img {
      width: 24px;
      height: 24px;
    }

    .back-link {
      display: inline-block;
      margin-top: 25px;
      color: #64748b;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s;
    }
    
    .back-link:hover {
      color: #94a3b8;
    }

  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">🎨</div>
    <h1>Sign In Required</h1>
    <p>Please sign in to access PixelCraft AI tools. All our tools are 100% free!</p>
    
    <a href="/auth/google" class="google-btn-wrapper" id="google-login">
      <div class="google-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="24px" height="24px"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
        Sign in with Google
      </div>
    </a>
    
    <a href="/" class="back-link">← Back to Home</a>
  </div>

  <script>
    // Grab the returnTo parameter from the URL and append it to the Google login link
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const returnTo = urlParams.get("returnTo");
      if (returnTo) {
        const loginBtn = document.getElementById("google-login");
        loginBtn.href = "/auth/google?returnTo=" + encodeURIComponent(returnTo);
      }
    });
  </script>
</body>
</html>

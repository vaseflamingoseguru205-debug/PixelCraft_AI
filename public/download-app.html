<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download PixelCraft AI App</title>
  <meta name="description" content="Install the PixelCraft AI app on your Android device for instant access to 20+ free AI image editing tools.">
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="icon" href="logo.jpg?v=4" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #0f172a;
      text-align: center;
    }
    .container {
      background: #ffffff;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      max-width: 400px;
      width: 90%;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: #2563EB;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 24px;
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: 800;
      color: #1e293b;
    }
    p {
      margin: 0 0 32px;
      font-size: 15px;
      color: #64748b;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      background: #2563EB;
      color: white;
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      box-sizing: border-box;
    }
    .btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
    }
    .btn:active {
      transform: translateY(0);
    }
    .instructions {
      margin-top: 24px;
      font-size: 13px;
      color: #94a3b8;
      text-align: left;
      background: #f1f5f9;
      padding: 16px;
      border-radius: 12px;
    }
    .instructions ul {
      margin: 8px 0 0;
      padding-left: 20px;
    }
    .instructions li {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="logo.jpg?v=4" alt="PixelCraft Logo" style="height: 60px; border-radius: 50%; display: block; margin: 0 auto 15px;">
    <h1>Install PixelCraft AI</h1>
    <p>Get the official app on your Android device for faster access and a full-screen experience.</p>
    
    <button id="install-btn" class="btn">Download & Install App</button>

    <div class="instructions" id="fallback-instructions" style="display:none;">
      <strong>If the button doesn't work:</strong>
      <ul>
        <li>Tap the <strong>3 dots (⋮)</strong> menu in Chrome</li>
        <li>Select <strong>"Add to Home screen"</strong> or <strong>"Install app"</strong></li>
      </ul>
    </div>
  </div>

  <script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }

    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');
    const fallbackInstructions = document.getElementById('fallback-instructions');

    // Wait for the browser to trigger the install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevent automatic prompt
      e.preventDefault();
      // Store the event
      deferredPrompt = e;
      installBtn.textContent = "Download & Install App";
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        // Show the native Android install prompt
        deferredPrompt.prompt();
        // Wait for user to decide
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('App Installed');
          installBtn.textContent = "Installed Successfully! 🎉";
          installBtn.style.background = "#10b981";
        }
        deferredPrompt = null;
      } else {
        // If the browser doesn't support the prompt or already installed
        fallbackInstructions.style.display = 'block';
        installBtn.textContent = "Check instructions below 👇";
      }
    });

    // Check if running in standalone mode (already installed)
    if (window.matchMedia('(display-mode: standalone)').matches) {
      installBtn.textContent = "App is already installed! 🎉";
      installBtn.style.background = "#10b981";
      installBtn.disabled = true;
    }
  </script>
</body>
</html>

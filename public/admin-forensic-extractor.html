<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forensic Extractor | PixelCraft AI</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #000; color: #10b981; font-family: 'JetBrains Mono', monospace;
      margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
    }
    .container {
      max-width: 800px; width: 100%; border: 1px solid #333; padding: 20px; border-radius: 8px;
      background: #0a0a0a;
    }
    h1 { color: #ef4444; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .dropzone {
      border: 2px dashed #333; padding: 40px; text-align: center; cursor: pointer;
      margin: 20px 0; color: #888;
    }
    .dropzone:hover { border-color: #10b981; color: #10b981; }
    .terminal {
      background: #050505; border: 1px solid #222; padding: 15px; height: 300px; overflow-y: auto;
      margin-top: 20px; color: #e2e8f0; font-size: 0.9rem;
    }
    .terminal .success { color: #10b981; font-weight: bold; }
    .terminal .error { color: #ef4444; }
    .terminal .sys { color: #06b6d4; }
    #previewImg { max-width: 100%; max-height: 300px; display: none; margin: 10px auto; }
  </style>
</head>
<body>

  <div class="container">
    <h1>CLASSIFIED: FORENSIC EXTRACTOR v2.0</h1>
    <p>Upload a compressed JPEG/WebP/PNG image to blindly extract the QIM Spatial Watermark.</p>
    
    <div class="dropzone" id="dropzone">Click or Drop Suspicious Media Here</div>
    <input type="file" id="fileInput" accept="image/*" style="display: none;">
    <img id="previewImg" src="">
    
    <canvas id="hiddenCanvas" style="display: none;"></canvas>
    
    <div class="terminal" id="terminal">
      <div class="sys">> SYSTEM BOOT SEQUENCE INITIATED...</div>
      <div class="sys">> QIM DECODER ENGINE ONLINE.</div>
    </div>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const terminal = document.getElementById('terminal');
    const previewImg = document.getElementById('previewImg');
    const hiddenCanvas = document.getElementById('hiddenCanvas');
    const ctx = hiddenCanvas.getContext('2d', { willReadFrequently: true });

    function logTerminal(msg, type = '') {
      const div = document.createElement('div');
      div.textContent = '> ' + msg;
      if (type) div.className = type;
      terminal.appendChild(div);
      terminal.scrollTop = terminal.scrollHeight;
    }

    dropzone.addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) processImage(e.target.files[0]);
    });

    function processImage(file) {
        logTerminal(`Loading file: ${file.name}...`, 'sys');
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                previewImg.src = img.src;
                previewImg.style.display = 'block';
                logTerminal(`Image loaded [${img.width}x${img.height}]`);
                extractWatermark(img);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function extractWatermark(img) {
        hiddenCanvas.width = img.width;
        hiddenCanvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, img.width, img.height);
        const data = imageData.data;
        const width = imageData.width;
        const height = imageData.height;
        
        logTerminal('Scanning Blue-channel QIM blocks...');
        
        const blockSize = 8;
        const blocksX = Math.floor(width / blockSize);
        const blocksY = Math.floor(height / blockSize);
        const totalBlocks = blocksX * blocksY;
        
        const maxBits = 250; 
        const redundancyCount = 25; 
        const qStep = 16;
        
        if (totalBlocks < maxBits) {
            logTerminal('Error: Image too small to contain signature.', 'error');
            return;
        }

        let seed = 1337;
        function random() {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }
        
        let blockIndices = new Uint32Array(totalBlocks);
        for(let i=0; i<totalBlocks; i++) blockIndices[i] = i;
        for(let i = totalBlocks - 1; i > 0; i--) {
            const j = Math.floor(random() * (i + 1));
            const temp = blockIndices[i];
            blockIndices[i] = blockIndices[j];
            blockIndices[j] = temp;
        }
        
        let bitVotes = new Int32Array(maxBits);
        let blockPtr = 0;
        
        for(let r = 0; r < redundancyCount; r++) {
            for(let i = 0; i < maxBits; i++) {
                if (blockPtr >= totalBlocks) break;
                const blockIndex = blockIndices[blockPtr++];
                
                const bx = blockIndex % blocksX;
                const by = Math.floor(blockIndex / blocksX);
                const startX = bx * blockSize;
                const startY = by * blockSize;
                
                let sum = 0;
                let count = 0;
                for(let y = startY; y < startY + blockSize; y++) {
                    for(let x = startX; x < startX + blockSize; x++) {
                        sum += data[(y * width + x) * 4 + 2];
                        count++;
                    }
                }
                const avg = sum / count;
                
                const val0 = Math.round(avg / qStep) * qStep;
                const val1 = Math.round((avg - qStep/2)/qStep)*qStep + qStep/2;
                
                const dist0 = Math.abs(avg - val0);
                const dist1 = Math.abs(avg - val1);
                
                if (dist1 < dist0) {
                    bitVotes[i]++;
                } else {
                    bitVotes[i]--;
                }
            }
        }
        
        logTerminal('Resolving majority votes...');
        let binaryStr = '';
        for(let i=0; i<maxBits; i++) {
            binaryStr += (bitVotes[i] > 0) ? '1' : '0';
        }
        
        let text = '';
        for(let i=0; i<binaryStr.length; i+=8) {
            const byteStr = binaryStr.substr(i, 8);
            if (byteStr.length === 8) {
                text += String.fromCharCode(parseInt(byteStr, 2));
            }
        }
        
        logTerminal('Raw Decoded Buffer: ' + text.replace(/[^a-zA-Z0-9:|_\-]/g, '?'));
        
        const match = /PX-[A-Z0-9]{9}/.exec(text);
        if (match) {
            logTerminal('=======================================', 'success');
            logTerminal(`[CRITICAL MATCH] FORENSIC ID FOUND: ${match[0]}`, 'success');
            logTerminal('=======================================', 'success');
        } else {
            logTerminal('No valid Forensic ID found. Image may be clean or too heavily degraded.', 'error');
        }
    }
  </script>
</body>
</html>

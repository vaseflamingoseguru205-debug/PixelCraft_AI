<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secret Forensic Extractor | PixelCraft AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #020617; color: #f8fafc; font-family: 'Space Grotesk', sans-serif; text-align: center; padding: 50px; }
    #uploadBox { border: 2px dashed #38bdf8; padding: 40px; border-radius: 12px; cursor: pointer; max-width: 600px; margin: 0 auto; background: rgba(56, 189, 248, 0.1); }
    #result { margin-top: 30px; font-size: 1.5rem; color: #10b981; font-weight: bold; background: #000; padding: 20px; border-radius: 8px; border: 1px solid #10b981; display: inline-block; }
    canvas { display: none; }
  </style>
</head>
<body>
  <h1>🕵️‍♂️ Secret Forensic Extractor</h1>
  <p style="color: #94a3b8; margin-bottom: 40px;">Upload an image that was sanitized by the Digital Fingerprint Wiper to extract its hidden Session ID.</p>
  
  <div id="uploadBox" onclick="document.getElementById('fileIn').click()">
    <h2>Click to Upload Sanitized Image</h2>
    <input type="file" id="fileIn" style="display:none;" accept="image/png">
  </div>

  <div id="result" style="display:none;"></div>
  <canvas id="cvs"></canvas>

  <script>
    const fileIn = document.getElementById('fileIn');
    const result = document.getElementById('result');
    const cvs = document.getElementById('cvs');
    const ctx = cvs.getContext('2d');

    fileIn.addEventListener('change', (e) => {
        if(e.target.files.length) extract(e.target.files[0]);
    });

    function pseudoRandom(seed) {
        let x = Math.sin(seed++) * 10000;
        return x - Math.floor(x);
    }

    function extract(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                cvs.width = img.width;
                cvs.height = img.height;
                ctx.drawImage(img, 0, 0);
                const data = ctx.getImageData(0,0,cvs.width,cvs.height).data;
                const totalPixels = data.length / 4;

                // The watermark is embedded starting at seed 42
                let seed = 42; 
                let extractedBits = "";
                
                // Extract 300 bits (should cover 25 characters easily)
                for(let i=0; i<300; i++) {
                    const pos = Math.floor(pseudoRandom(seed++) * totalPixels) * 4;
                    if(pos < data.length - 4) {
                        const bit = data[pos + 2] & 1; // Extract LSB of Blue channel
                        extractedBits += bit;
                    } else {
                        extractedBits += "0";
                    }
                }

                // Convert bits to string
                let text = "";
                for(let i=0; i<extractedBits.length; i+=8) {
                    const byte = extractedBits.substr(i, 8);
                    text += String.fromCharCode(parseInt(byte, 2));
                }

                // Search for pattern PX_FORENSIC:PX-XXXXXX|
                const match = text.match(/PX_FORENSIC:(PX-[A-Z0-9]+)\|/);
                
                result.style.display = 'inline-block';
                if(match) {
                    result.style.color = '#10b981';
                    result.style.borderColor = '#10b981';
                    result.innerHTML = `✅ Watermark Found!<br><span style="font-size:2rem; color:#fff;">Session ID: ${match[1]}</span>`;
                } else {
                    result.style.color = '#ef4444';
                    result.style.borderColor = '#ef4444';
                    result.innerHTML = `❌ No valid watermark found.<br><span style="font-size:1rem; color:#94a3b8;">Make sure you upload a PNG generated by the Wiper tool.</span>`;
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }
  </script>
</body>
</html>

  <style>
    body { background: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }

    .form-group input, .form-group textarea { width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.8); border: 1px solid #475569; border-radius: 8px; color: white; font-family: inherit; font-size: 1rem; box-sizing: border-box; transition: 0.3s; }
    .form-group input:focus, .form-group textarea:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }

    .btn-action:hover { background: linear-gradient(135deg, #3b82f6, #2563eb); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6); }

    .spinner { width: 50px; height: 50px; border: 4px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .alert-box { background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #34d399; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; }
    .error-box { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #f87171; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; }

<body>
  <div class="container">

    <!-- ENCRYPT PANEL -->

    <!-- DECRYPT PANEL -->
    <div id="panel-decrypt" class="panel">
      <div class="drop-zone" id="dec-drop">
        Drag & Drop Encrypted Image Here<br><br>or Click to Browse
        <input type="file" id="dec-file" accept="image/png" style="display:none;">
      </div>
      <div class="preview-container" id="dec-preview-container">
        <img id="dec-preview" src="" alt="Preview">

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="dec-pwd" placeholder="Enter Real or Decoy Password">

      <button class="btn-action" id="btn-decrypt">EXTRACT MESSAGE</button>

      <div id="dec-result" style="display: none; margin-top: 20px;">
        <label style="color:#cbd5e1; font-weight:bold; margin-bottom:10px; display:block;">Extracted Message:</label>
        <div id="dec-text" style="background: rgba(0,0,0,0.5); padding: 20px; border-radius: 8px; border: 1px solid #475569; color: #a7f3d0; white-space: pre-wrap; font-family: monospace;"></div>

  <canvas id="hidden-canvas" style="display:none;"></canvas>

  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <div id="loading-text" style="color: #60a5fa; font-weight: bold; font-size: 1.2rem;">Processing...</div>

  <script>
    // TABS
    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        if(tab === 'encrypt') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('panel-encrypt').classList.add('active');
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('panel-decrypt').classList.add('active');
        }
    }

    // UI Helpers
    function showLoading(text) {
        document.getElementById('loading-text').innerText = text;
        document.getElementById('loading').style.display = 'flex';
    }
    function hideLoading() {
        document.getElementById('loading').style.display = 'none';
    }

    // File Handlers
    let targetImage = null;
    let decryptImage = null;

    function handleFile(file, isEncrypt) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                if(isEncrypt) {
                    targetImage = img;
                    document.getElementById('enc-preview').src = img.src;
                    document.getElementById('enc-preview-container').style.display = 'block';
                } else {
                    decryptImage = img;
                    document.getElementById('dec-preview').src = img.src;
                    document.getElementById('dec-preview-container').style.display = 'block';
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    document.getElementById('enc-drop').onclick = () => document.getElementById('enc-file').click();
    document.getElementById('enc-file').onchange = (e) => handleFile(e.target.files[0], true);
    
    document.getElementById('dec-drop').onclick = () => document.getElementById('dec-file').click();
    document.getElementById('dec-file').onchange = (e) => handleFile(e.target.files[0], false);

    // Cryptography Admin Public Key (For Police Forensics)
    const ADMIN_PUBLIC_KEY = {
        "alg": "RSA-OAEP-256", "e": "AQAB", "ext": true,
        "key_ops": ["encrypt"], "kty": "RSA",
        "n": "v1gO_1f0kXpUXY2cR5K3y2cR5K3..." // Dummy shortened for simplicity in this demo build
    };

    function aesEncrypt(text, pwd) {
        return CryptoJS.AES.encrypt(text, pwd).toString();
    }
    function aesDecrypt(cipher, pwd) {
        try {
            const bytes = CryptoJS.AES.decrypt(cipher, pwd);
            return bytes.toString(CryptoJS.enc.Utf8);
        } catch(e) { return null; }
    }

    // QIM Engine Math
    function mulberry32(a) {
        return function() {
            var t = a += 0x6D2B79F5;
            t = Math.imul(t ^ t >>> 15, t | 1);
            t ^= t + Math.imul(t ^ t >>> 7, t | 61);
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }
    }
    function hashString(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) hash = Math.imul(31, hash) + str.charCodeAt(i) | 0;
        return hash;
    }

    const BLOCK_SIZE = 8;
    const Q_STEP = 16;
    const REDUNDANCY = 25;

    function embedQIM(data, width, height, binaryStr, seedStr) {
        const blocksX = Math.floor(width / BLOCK_SIZE);
        const blocksY = Math.floor(height / BLOCK_SIZE);
        const totalBlocks = blocksX * blocksY;
        
        if (totalBlocks < binaryStr.length * REDUNDANCY) throw new Error("Image too small.");

        let prng = mulberry32(hashString(seedStr));
        let indices = new Uint32Array(totalBlocks);
        for(let i=0; i<totalBlocks; i++) indices[i] = i;
        for(let i=totalBlocks-1; i>0; i--) {
            const j = Math.floor(prng() * (i + 1));
            const t = indices[i]; indices[i] = indices[j]; indices[j] = t;
        }

        let ptr = 0;
        for(let r=0; r<REDUNDANCY; r++) {
            for(let i=0; i<binaryStr.length; i++) {
                const bit = parseInt(binaryStr[i]);
                const idx = indices[ptr++];
                const bx = idx % blocksX;
                const by = Math.floor(idx / blocksX);
                const sx = bx * BLOCK_SIZE;
                const sy = by * BLOCK_SIZE;

                let sum=0, count=0;
                for(let y=sy; y<sy+BLOCK_SIZE; y++) {
                    for(let x=sx; x<sx+BLOCK_SIZE; x++) {
                        sum += data[(y*width+x)*4+2];
                        count++;
                    }
                }
                const avg = sum/count;
                const q_avg = Math.round((avg - bit*(Q_STEP/2))/Q_STEP)*Q_STEP + bit*(Q_STEP/2);
                const adj = q_avg - avg;

                for(let y=sy; y<sy+BLOCK_SIZE; y++) {
                    for(let x=sx; x<sx+BLOCK_SIZE; x++) {
                        const p = (y*width+x)*4+2;
                        data[p] = Math.max(0, Math.min(255, data[p] + adj));
                    }
                }
            }
        }
    }

    function extractQIM(data, width, height, seedStr, maxBits) {
        const blocksX = Math.floor(width / BLOCK_SIZE);
        const blocksY = Math.floor(height / BLOCK_SIZE);
        const totalBlocks = blocksX * blocksY;

        let prng = mulberry32(hashString(seedStr));
        let indices = new Uint32Array(totalBlocks);
        for(let i=0; i<totalBlocks; i++) indices[i] = i;
        for(let i=totalBlocks-1; i>0; i--) {
            const j = Math.floor(prng() * (i + 1));
            const t = indices[i]; indices[i] = indices[j]; indices[j] = t;
        }

        let votes = new Int32Array(maxBits);
        let ptr = 0;
        
        for(let r=0; r<REDUNDANCY; r++) {
            for(let i=0; i<maxBits; i++) {
                if (ptr >= totalBlocks) break;
                const idx = indices[ptr++];
                const bx = idx % blocksX;
                const by = Math.floor(idx / blocksX);
                const sx = bx * BLOCK_SIZE;
                const sy = by * BLOCK_SIZE;

                let sum=0, count=0;
                for(let y=sy; y<sy+BLOCK_SIZE; y++) {
                    for(let x=sx; x<sx+BLOCK_SIZE; x++) {
                        sum += data[(y*width+x)*4+2];
                        count++;
                    }
                }
                const avg = sum/count;
                const v0 = Math.round(avg/Q_STEP)*Q_STEP;
                const v1 = Math.round((avg-Q_STEP/2)/Q_STEP)*Q_STEP + Q_STEP/2;
                
                if (Math.abs(avg-v1) < Math.abs(avg-v0)) votes[i]++;
                else votes[i]--;
            }
        }

        let bin = '';
        for(let i=0; i<maxBits; i++) bin += (votes[i] > 0) ? '1' : '0';
        return bin;
    }

    // Handlers
    document.getElementById('btn-encrypt').addEventListener('click', async () => {
        if(!targetImage) return alert('Select image');
        const rMsg = document.getElementById('enc-real-msg').value;
        const rPwd = document.getElementById('enc-real-pwd').value;
        const dMsg = document.getElementById('enc-decoy-msg').value;
        const dPwd = document.getElementById('enc-decoy-pwd').value;

        if(!rMsg || !rPwd) return alert('Real message and password required.');

        showLoading('Applying Advanced QIM Engine...');
        await new Promise(r => setTimeout(r, 50));

        try {
            const cvs = document.getElementById('hidden-canvas');
            cvs.width = targetImage.width;
            cvs.height = targetImage.height;
            const ctx = cvs.getContext('2d');
            ctx.drawImage(targetImage, 0, 0);
            const imgData = ctx.getImageData(0, 0, cvs.width, cvs.height);

            const sid = "PX-" + Math.random().toString(36).substr(2,6).toUpperCase();
            
            // 1. Real
            const rCipher = aesEncrypt(rMsg, rPwd);
            let rBin = '';
            for(let i=0; i<rCipher.length; i++) rBin += rCipher.charCodeAt(i).toString(2).padStart(8,'0');
            embedQIM(imgData.data, cvs.width, cvs.height, rBin, rPwd);

            // 2. Decoy
            if (dMsg && dPwd) {
                const dCipher = aesEncrypt(dMsg, dPwd);
                let dBin = '';
                for(let i=0; i<dCipher.length; i++) dBin += dCipher.charCodeAt(i).toString(2).padStart(8,'0');
                embedQIM(imgData.data, cvs.width, cvs.height, dBin, dPwd);
            }

            ctx.putImageData(imgData, 0, 0);
            const url = cvs.toDataURL('image/png');
            document.getElementById('btn-download').onclick = () => {
                const a = document.createElement('a'); a.href = url; a.download = 'secure.png'; a.click();
            };
            document.getElementById('enc-result').style.display = 'block';
            hideLoading();
        } catch(e) {
            hideLoading();
            alert('Error: ' + e.message);
        }
    });

    document.getElementById('btn-decrypt').addEventListener('click', async () => {
        if(!decryptImage) return alert('Select image');
        const pwd = document.getElementById('dec-pwd').value;
        if(!pwd) return alert('Password required');

        showLoading('Extracting QIM Blocks...');
        await new Promise(r => setTimeout(r, 50));

        try {
            const cvs = document.getElementById('hidden-canvas');
            cvs.width = decryptImage.width;
            cvs.height = decryptImage.height;
            const ctx = cvs.getContext('2d');
            ctx.drawImage(decryptImage, 0, 0);
            const imgData = ctx.getImageData(0, 0, cvs.width, cvs.height);

            const maxBits = 8000; // 1000 characters
            const bin = extractQIM(imgData.data, cvs.width, cvs.height, pwd, maxBits);
            
            let cipher = '';
            for(let i=0; i<bin.length; i+=8) {
                const byte = bin.substr(i,8);
                if(byte.length===8) cipher += String.fromCharCode(parseInt(byte,2));
            }

            // Cleanup padding
            cipher = cipher.replace(/\0/g, '');

            const msg = aesDecrypt(cipher, pwd);
            if(msg) {
                document.getElementById('dec-text').innerText = msg;
                document.getElementById('dec-result').style.display = 'block';
            } else {
                alert('Wrong password or corrupted image.');
            }
            hideLoading();
        } catch(e) {
            hideLoading();
            alert('Extraction failed.');
        }
    });
  </script>

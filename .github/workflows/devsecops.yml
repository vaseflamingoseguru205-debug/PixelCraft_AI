name: PixelCraft AI DevSecOps Pipeline

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  # ============================================================
  # JOB 1: Scan karo, AI se fix karwao, aur wapas push karo
  # ============================================================
  scan-and-fix:
    name: "🔍 Scan & 🤖 AI Auto-Fix"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Gate 1: Secret Scanning
      - name: "🔑 Secret Scanner (TruffleHog)"
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./

      # Gate 2: Trivy Scan - Generate JSON report for AI
      - name: "🛡️ Trivy Vulnerability Scan"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          scanners: 'vuln'

      # Gate 3: Generate Markdown Report in GitHub Summary
      - name: "📊 Generate Markdown Report"
        if: always()
        run: |
          echo "## 🛡️ Trivy Vulnerability Report" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs . --scanners vuln >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "✅ Markdown Report added to Job Summary!"

      # Gate 3b: Generate and Upload HTML Report (for downloading)
      - name: "📄 Generate & Upload HTML Report"
        if: always()
        run: |
          # Downloading html.tpl from the repo gives a 404 (exit code 4).
          # Using the local html.tpl already present in the workspace.
          trivy fs . --scanners vuln --format template --template "@html.tpl" -o trivy-report.html
          echo "✅ HTML Report generated!"

      - name: "📤 Upload HTML Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-html
          path: trivy-report.html

      # Send WhatsApp Notification if Vulnerabilities exist
      - name: "📱 Send WhatsApp Notification"
        if: always()
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
        run: |
          # Check if Trivy found any vulnerabilities
          if grep -q '"Vulnerabilities":' trivy-results.json; then
             RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
             MESSAGE="🚨 *PixelCraft AI Alert!* 🚨%0A%0AHigh/Critical Vulnerabilities found in the latest push!%0A%0AThe AI is attempting to auto-fix them. Check the full report directly here (No ZIP required):%0A$RUN_URL"
             
             if [ -n "$WHATSAPP_PHONE" ] && [ -n "$WHATSAPP_API_KEY" ]; then
                curl -s -X GET "https://api.callmebot.com/whatsapp.php?phone=$WHATSAPP_PHONE&text=$MESSAGE&apikey=$WHATSAPP_API_KEY"
                echo "✅ WhatsApp notification sent!"
             else
                echo "ℹ️ WhatsApp credentials not found in secrets. Skipping notification."
             fi
          else
             echo "ℹ️ No vulnerabilities found. No WhatsApp message sent."
          fi

      # Send Telegram Notification
      - name: "✈️ Send Telegram Security Alert"
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install requests --quiet
          python -c '
          import os, requests

          bot_token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.getenv("TELEGRAM_CHAT_ID", "").strip()
          repo = "${{ github.repository }}"
          run_id = "${{ github.run_id }}"
          branch = "${{ github.head_ref }}" or "${{ github.ref_name }}"
          run_url = f"https://github.com/{repo}/actions/runs/{run_id}"

          if bot_token.startswith("bot"):
              bot_token = bot_token[3:]

          if bot_token and chat_id:
              url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
              
              has_vulns = False
              try:
                  with open("trivy-results.json", "r") as f:
                      if "Vulnerabilities" in f.read():
                          has_vulns = True
              except Exception:
                  pass

              if has_vulns:
                  msg = f"🚨 PixelCraft AI Security Alert! 🚨\n\n📌 Branch: {branch}\n⚠️ Status: Security vulnerabilities detected!\n🤖 AI Remediator: Attempting auto-fix...\n\n🔗 View GitHub Run: {run_url}"
              else:
                  msg = f"✅ PixelCraft AI Security Report ✅\n\n📌 Branch: {branch}\n✨ Status: All security checks passed!\n\n🔗 View GitHub Run: {run_url}"

              payload = {"chat_id": chat_id, "text": msg, "disable_web_page_preview": True}
              res = requests.post(url, json=payload)
              if res.status_code == 200:
                  print("✅ Telegram notification sent successfully!")
              else:
                  print(f"❌ Telegram API Error ({res.status_code}): {res.text}")
                  print(f"Used Token: {bot_token[:5]}...{bot_token[-4:]} | Chat ID: {chat_id}")
                  res.raise_for_status()
          else:
              print("ℹ️ Telegram credentials not set in secrets. Skipping notification.")
          '

      # Upload JSON Report (Hidden, used by AI)
      - name: "📤 Upload JSON Report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-json
          path: trivy-results.json

      # Gate 4: AI Auto-Remediator
      - name: "🤖 AI Auto-Remediator (Gemini)"
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install requests --quiet
          python scripts/ai_remediator.py

      - name: "Upload AI Debug Log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-debug-log
          path: ai_debug.log
          retention-days: 1

      # Gate 5: Push auto-remediation back to the branch
      - name: "🚀 Push AI Fixes to Branch"
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Cleanup temp files
          rm -f trivy-results.json trivy-report.html html.tpl
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          
          # Check if any staged changes exist (e.g. package.json/package-lock.json modified)
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-fix: AI patched vulnerabilities [skip ci]"
            BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
            
            # Pull with rebase to avoid rejected pushes if the remote advanced
            git pull --rebase origin $BRANCH_NAME || true
            
            git push origin HEAD:$BRANCH_NAME
            echo "✅ AI fixes pushed to branch: $BRANCH_NAME"
          else
            echo "ℹ️ No package changes needed. Already clean!"
          fi

  # ============================================================
  # JOB 2: AI fix ke baad VERIFY karo - yahi green/red karega PR ko
  # ============================================================
  verify-after-fix:
    name: "✅ Verify Clean Scan (for Merge)"
    runs-on: ubuntu-latest
    needs: scan-and-fix  # Job 1 complete hone ke baad hi chalega

    steps:
      - name: Checkout Latest Code (with AI fixes)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      # Snyk - ab yeh fail karega agar AI ne fix nahi kiya
      - name: "🔒 Snyk Final Security Gate"
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high

      - name: "🎉 All Clear! Safe to Merge."
        run: echo "All security checks passed! This PR is safe to merge."
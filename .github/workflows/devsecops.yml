name: PixelCraft AI DevSecOps Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ============================================================
  # JOB 1: Scan karo, AI se fix karwao, aur wapas push karo
  # ============================================================
  scan-and-fix:
    name: "🔍 Scan & 🤖 AI Auto-Fix"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Gate 1: Secret Scanning
      - name: "🔑 Secret Scanner (TruffleHog)"
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./

      # Gate 2: Trivy Scan - Generate JSON report for AI
      - name: "🛡️ Trivy Vulnerability Scan"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln,secret,misconfig'

      # Gate 3: Generate Markdown Report in GitHub Summary
      - name: "📊 Generate Markdown Report"
        if: always()
        run: |
          echo "## 🛡️ Trivy Vulnerability Report" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs . --scanners vuln,secret,misconfig >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "✅ Markdown Report added to Job Summary!"

      # Gate 3b: Generate and Upload HTML Report (for downloading)
      - name: "📄 Generate & Upload HTML Report"
        if: always()
        run: |
          wget -q https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl
          trivy fs . --scanners vuln,secret,misconfig --format template --template "@html.tpl" -o trivy-report.html
          echo "✅ HTML Report generated!"

      - name: "📤 Upload HTML Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-html
          path: trivy-report.html

      # Send WhatsApp Notification if Vulnerabilities exist
      - name: "📱 Send WhatsApp Notification"
        if: always()
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
        run: |
          # Check if Trivy found any vulnerabilities
          if grep -q '"Vulnerabilities":' trivy-results.json; then
             RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
             MESSAGE="🚨 *PixelCraft AI Alert!* 🚨%0A%0AHigh/Critical Vulnerabilities found in the latest push!%0A%0AThe AI is attempting to auto-fix them. Check the full report directly here (No ZIP required):%0A$RUN_URL"
             
             if [ -n "$WHATSAPP_PHONE" ] && [ -n "$WHATSAPP_API_KEY" ]; then
                curl -s -X GET "https://api.callmebot.com/whatsapp.php?phone=$WHATSAPP_PHONE&text=$MESSAGE&apikey=$WHATSAPP_API_KEY"
                echo "✅ WhatsApp notification sent!"
             else
                echo "ℹ️ WhatsApp credentials not found in secrets. Skipping notification."
             fi
          else
             echo "ℹ️ No vulnerabilities found. No WhatsApp message sent."
          fi

      # Upload JSON Report (Hidden, used by AI)
      - name: "📤 Upload JSON Report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-json
          path: trivy-results.json

      # Gate 4: AI Auto-Remediator
      - name: "🤖 AI Auto-Remediator (Gemini)"
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install requests --quiet
          python scripts/ai_remediator.py

      - name: "Upload AI Debug Log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-debug-log
          path: ai_debug.log
          retention-days: 1

      # Gate 5: Push auto-remediation back to the branch
      - name: "🚀 Push AI Fixes to Branch"
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Cleanup temp files
          rm -f trivy-results.json trivy-report.html html.tpl
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          
          # Check if any files were changed by AI
          if ! git diff-index --quiet HEAD; then
            git commit -m "🤖 Auto-fix: AI patched vulnerabilities [skip ci]"
            BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
            
            # Pull with rebase to avoid rejected pushes if the remote advanced
            git pull --rebase origin $BRANCH_NAME
            
            git push origin HEAD:$BRANCH_NAME
            echo "✅ AI fixes pushed to branch: $BRANCH_NAME"
          else
            echo "ℹ️ No AI fixes were generated. Already clean!"
          fi

  # ============================================================
  # JOB 2: AI fix ke baad VERIFY karo - yahi green/red karega PR ko
  # ============================================================
  verify-after-fix:
    name: "✅ Verify Clean Scan (for Merge)"
    runs-on: ubuntu-latest
    needs: scan-and-fix  # Job 1 complete hone ke baad hi chalega

    steps:
      - name: Checkout Latest Code (with AI fixes)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      # Snyk - ab yeh fail karega agar AI ne fix nahi kiya
      - name: "🔒 Snyk Final Security Gate"
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high

      - name: "🎉 All Clear! Safe to Merge."
        run: echo "All security checks passed! This PR is safe to merge."
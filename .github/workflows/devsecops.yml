name: PixelCraft AI DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-gates:
    name: Automated Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gate 1: Secret Scanning (Full Repository Scan)
      # 'base' aur 'head' hata diya gaya hai taaki pure folder ka safe snapshot scan ho sake
      - name: Run TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./

      # Gate 2: SCA / Dependency Scan (Snyk)
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high # Sirf High/Critical bugs par fail karega

      # Gate 3: Trivy Scanner (AI Auto-Remediation ke liye JSON report generate karega)
      - name: Run Trivy Vulnerability Scanner
        # if: always() # Agar tu chahta hai ki Snyk fail hone ke baad bhi Trivy chale, toh yeh line uncomment kar dena
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # Upload Trivy JSON Report Artifact
      - name: Upload Trivy JSON Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.json

      # Run AI Auto-Remediator Python Script
      - name: Run AI Auto-Remediator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install requests
          python scripts/ai_remediator.py
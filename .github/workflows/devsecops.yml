name: PixelCraft AI DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-gates:
    name: Automated Security Scans
    runs-on: ubuntu-latest
    permissions:
      contents: write # 👈 This is required so the bot can push code back

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gate 1: Secret Scanning (Full Repository Scan)
      # 'base' aur 'head' hata diya gaya hai taaki pure folder ka safe snapshot scan ho sake
      - name: Run TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./

      # Gate 2: SCA / Dependency Scan (Snyk)
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high # Sirf High/Critical bugs par fail karega

      # Gate 3: Trivy Scanner (AI Auto-Remediation ke liye JSON report generate karega)
      - name: Run Trivy Vulnerability Scanner
        if: always() # Agar tu chahta hai ki Snyk fail hone ke baad bhi Trivy chale, toh yeh line uncomment kar dena
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # Upload Trivy JSON Report Artifact
      - name: Upload Trivy JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-json
          path: trivy-results.json

      # Generate HTML Report
      - name: Generate HTML Report
        if: always()
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          wget https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl
          trivy fs . --format template --template "@html.tpl" -o trivy-report.html

      # Upload Trivy HTML Report Artifact
      - name: Upload Trivy HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-html
          path: trivy-report.html

      # Run AI Auto-Remediator Python Script
      - name: Run AI Auto-Remediator
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install requests
          python scripts/ai_remediator.py

      # Commit and Push AI Fixes back to the repository
      - name: Commit and Push AI Fixes
        if: always()
        run: |
          # Clean up generated files so they aren't committed
          rm -rf .cache trivy-results.json trivy-report.html trivy-report.pdf html.tpl
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          # Check if there are any changes (like package.json updates)
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-fix vulnerabilities by Gemini AI [skip ci]"
            # Use HEAD:branch_name to push from detached HEAD
            BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
            git push origin HEAD:$BRANCH_NAME
          else
            echo "No fixes were applied by AI."
          fi
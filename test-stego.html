<!DOCTYPE html>
<html>
<body>
<canvas id="c1"></canvas>
<canvas id="c2"></canvas>
<script>
    const c1 = document.getElementById('c1');
    c1.width = 100; c1.height = 100;
    const ctx1 = c1.getContext('2d');
    ctx1.fillStyle = 'red';
    ctx1.fillRect(0,0,100,100);
    
    let imgData = ctx1.getImageData(0,0,100,100);
    let data = imgData.data;
    
    const OFFSET = 1000;
    const sessionId = 'PX-DCY-123456789';
    const adminPayloadStr = "PXCADMIN|" + sessionId + "|END";
    const adminBytes = new TextEncoder().encode(adminPayloadStr);
    const adminBits = [];
    for(let i=0; i<adminBytes.length; i++) for(let j=7; j>=0; j--) adminBits.push((adminBytes[i] >> j) & 1);
    
    let adminBitPtr = 0;
    for(let i=0; i<OFFSET; i++) {
        if(i >= data.length) break;
        if((i+1)%4===0) continue;
        if (adminBitPtr < adminBits.length) {
            data[i] = (data[i] & ~1) | adminBits[adminBitPtr];
            adminBitPtr++;
        }
    }
    
    ctx1.putImageData(imgData, 0, 0);
    const dataUrl = c1.toDataURL('image/png');
    
    const img = new Image();
    img.onload = () => {
        const c2 = document.getElementById('c2');
        c2.width = 100; c2.height = 100;
        const ctx2 = c2.getContext('2d');
        ctx2.drawImage(img, 0, 0);
        
        let data2 = ctx2.getImageData(0,0,100,100).data;
        
        const extractedBytes = [];
        let currentByte = 0; let bitCount = 0;
        for(let i=0; i<1000; i++) {
            if(i >= data2.length) break;
            if((i+1)%4===0) continue;
            const bit = data2[i] & 1;
            currentByte = (currentByte << 1) | bit;
            bitCount++;
            if(bitCount === 8){ extractedBytes.push(currentByte); currentByte = 0; bitCount = 0; }
        }
        
        const rawStr = new TextDecoder().decode(new Uint8Array(extractedBytes));
        console.log("Raw Str:", rawStr);
        console.log("Found:", rawStr.indexOf("PXCADMIN|"));
        
        fetch('http://localhost:3000/log', {method:'POST', body:rawStr});
    };
    img.src = dataUrl;
</script>
</body>
</html>
